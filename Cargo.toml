[workspace]
resolver = "2"
members = ["crates/stack_core"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.88"
description = "Rust core of StackConnect: store API providers, authentication and account-export crypto, with UniFFI (Swift) and flutter_rust_bridge (Dart) bindings"
repository = "https://github.com/r1b2ns/stack-connect-core"
homepage = "https://github.com/r1b2ns/stack-connect-core"

[workspace.dependencies]
uniffi = { version = "0.31", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
thiserror = "2"
base64 = "0.22"
async-trait = "0.1"
# .scexport crypto (cross-compatible with the iOS AccountCrypto format).
aes-gcm = { version = "0.10", features = ["aes"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
# App Store screenshot upload commit checksum (sourceFileChecksum).
md-5 = "0.10"
uuid = { version = "1", features = ["v4"] }
# Gunzip for downloaded analytics report segments (Apple serves gzip TSV).
flate2 = "1"
# Decodes request paths for the diagnostic log (already in the tree via reqwest/url).
percent-encoding = "2"
# Apple ID web sign-in (auth/apple_session). The cookie jar is reqwest's own
# cookie store crate (same version reqwest's `cookies` feature uses), kept here
# so the session can be serialized to the host's opaque blob.
cookie_store = "0.22"
# SRP-6a big-number arithmetic (already in the tree via jsonwebtoken).
num-bigint = "0.4"
# Hashcash proof of work (X-Apple-HC): SHA-1, same RustCrypto family as sha2.
sha1 = "0.10"
# Wipes the password and the derived SRP key after use (already in the tree).
zeroize = "1"
# The SRP private ephemeral `a` (already in the tree via ring).
getrandom = "0.2"
# Hidden password prompt for the dev-only apple_signin_probe binary.
rpassword = "7"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# Smaller dev artifacts: line tables keep file:line in backtraces/panics but
# drop full variable debuginfo (lldb won't show locals). Third-party crates get
# no debuginfo at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
